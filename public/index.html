<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Socket Chat</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f5;
    }

    .chat {
      width: min(700px, 100%);
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .header {
      padding: 18px;
      background: #111827;
      color: white;
    }

    .header h2 {
      margin: 0;
    }

    .status {
      font-size: 13px;
      margin-top: 5px;
      color: #9ca3af;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 12px;
    }

    .message span {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      background: #e5e7eb;
      max-width: 80%;
      word-break: break-word;
    }

    .message.me {
      text-align: right;
    }

    .message.me span {
      background: #2563eb;
      color: white;
    }

    .system {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin: 10px;
    }

    .input-area {
      display: flex;
      padding: 15px;
      border-top: 1px solid #ddd;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="chat">

    <div class="header">
      <h2>💬 Socket Chat</h2>
      <div class="status" id="status">
        Connecting...
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <form class="input-area" id="form">
      <input
        id="input"
        placeholder="Type a message..."
        autocomplete="off"
      />

      <button type="submit">
        Send
      </button>
    </form>

  </div>

  <script>
    const socket = io();

    const status = document.getElementById("status");
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    socket.on("connect", () => {
      status.textContent = `Connected • ${socket.id}`;
    });

    socket.on("disconnect", () => {
      status.textContent = "Disconnected";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message) return;

      addMessage(message, true);

      socket.emit("broadcast_test", message);

      input.value = "";
      input.focus();
    });

    socket.on("broadcast_response", (data) => {
      addMessage(data.message, false);
    });

    function addMessage(message, ownMessage) {
      const div = document.createElement("div");

      div.className = ownMessage
        ? "message me"
        : "message";

      const span = document.createElement("span");

      span.textContent = message;

      div.appendChild(span);
      messages.appendChild(div);

      messages.scrollTop = messages.scrollHeight;
    }
  </script>

</body>
</html>
